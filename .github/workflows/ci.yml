name: Awareness CI/CD Pipeline

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Quality Gates & Architectural Invariant Audits
  # ============================================================================
  audit:
    name: Architecture & Privacy Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit: Zero Internet Permission
        run: |
          echo "Checking manifests for forbidden INTERNET permission..."
          TARGET_DIRS=$(ls -d app core feature 2>/dev/null || true)
          if [ -n "$TARGET_DIRS" ]; then
            ! grep -rn "android.permission.INTERNET" $TARGET_DIRS || {
              echo "FAILED: android.permission.INTERNET detected in codebase!"
              exit 1
            }
          fi
          echo "PASSED: Zero internet permission detected."

      - name: Audit: Zero Forbidden Schedulers & Polling
        run: |
          echo "Checking for AlarmManager, postDelayed, UsageStatsManager, setRepeating..."
          TARGET_DIRS=$(ls -d app core feature 2>/dev/null || true)
          if [ -n "$TARGET_DIRS" ]; then
            ! grep -rnE "(AlarmManager|postDelayed|UsageStatsManager|setRepeating|Handler\(Looper)" $TARGET_DIRS || {
              echo "FAILED: Forbidden scheduler/polling detected!"
              exit 1
            }
          fi
          echo "PASSED: Zero forbidden schedulers detected."

      - name: Audit: StudioBlank Design System (0dp Radius & Flat 0dp Elevation)
        run: |
          echo "Checking for non-zero RoundedCornerShape & elevation..."
          TARGET_DIRS=$(ls -d app core feature core/design-system 2>/dev/null || true)
          if [ -n "$TARGET_DIRS" ]; then
            ! grep -rnE "RoundedCornerShape\(([^0]|0\.[1-9])" $TARGET_DIRS || {
              echo "FAILED: Rounded corners detected! StudioBlank requires 0.dp (RectangleShape)."
              exit 1
            }
            ! grep -rnE "elevation = [1-9]" $TARGET_DIRS || {
              echo "FAILED: Elevation detected! StudioBlank requires flat 0.dp."
              exit 1
            }
          fi
          echo "PASSED: StudioBlank flat 0px design system verified."

  # ============================================================================
  # 2. Build & Test APK
  # ============================================================================
  build:
    name: Build & Test APK
    needs: audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Gradle Wrapper
        id: check_gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            echo "has_gradlew=true" >> $GITHUB_OUTPUT
          else
            echo "has_gradlew=false" >> $GITHUB_OUTPUT
            echo "Gradle wrapper not yet scaffolded. This step will activate once VS-01 is committed."
          fi

      # ----------------------------------------------------------------------
      # Staging Branch / PR: Debug Build with default debug key
      # ----------------------------------------------------------------------
      - name: Run Tests (Staging & PR)
        if: steps.check_gradle.outputs.has_gradlew == 'true' && github.ref != 'refs/heads/main'
        run: ./gradlew test --stacktrace

      - name: Build Debug APK (Staging & PR)
        if: steps.check_gradle.outputs.has_gradlew == 'true' && github.ref != 'refs/heads/main'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        if: steps.check_gradle.outputs.has_gradlew == 'true' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: awareness-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      # ----------------------------------------------------------------------
      # Main Branch: Production Release Build
      # ----------------------------------------------------------------------
      - name: Decode Release Keystore (Main Branch)
        if: steps.check_gradle.outputs.has_gradlew == 'true' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "Release keystore decoded successfully."
          else
            echo "RELEASE_KEYSTORE_BASE64 secret not set."
          fi

      - name: Build Release APK (Main Branch)
        if: steps.check_gradle.outputs.has_gradlew == 'true' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "$KEYSTORE_FILE" ]; then
            echo "Building signed Release APK with release keystore..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "No release keystore secret configured; building standard APK..."
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload Release APK
        if: steps.check_gradle.outputs.has_gradlew == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: awareness-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
