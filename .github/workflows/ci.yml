name: Awareness CI/CD Pipeline

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Quality Gates & Architectural Invariant Audits
  # ============================================================================
  audit:
    name: Architecture & Privacy Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit: Zero Internet Permission
        run: |
          echo "Checking manifests for forbidden INTERNET permission..."
          ! grep -rn "android.permission.INTERNET" app/ core/ feature/ || {
            echo "FAILED: android.permission.INTERNET detected in codebase!"
            exit 1
          }

      - name: Audit: Zero Forbidden Schedulers & Polling
        run: |
          echo "Checking for AlarmManager, postDelayed, UsageStatsManager, setRepeating..."
          ! grep -rnE "(AlarmManager|postDelayed|UsageStatsManager|setRepeating|Handler\(Looper)" app/ core/ feature/ || {
            echo "FAILED: Forbidden scheduler/polling detected!"
            exit 1
          }

      - name: Audit: StudioBlank Design System (0dp Radius & Flat 0dp Elevation)
        run: |
          echo "Checking for non-zero RoundedCornerShape..."
          ! grep -rnE "RoundedCornerShape\(([^0]|0\.[1-9])" core/design-system/ feature/ app/ || {
            echo "FAILED: Rounded corners detected! StudioBlank requires 0.dp (RectangleShape)."
            exit 1
          }
          echo "Checking for non-zero elevation..."
          ! grep -rnE "elevation = [1-9]" core/design-system/ feature/ app/ || {
            echo "FAILED: Elevation detected! StudioBlank requires flat 0.dp."
            exit 1
          }

  # ============================================================================
  # 2. Build & Test APK
  # ============================================================================
  build:
    name: Build & Test APK
    needs: audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Gradle Wrapper
        id: check_gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            echo "has_gradlew=true" >> $GITHUB_OUTPUT
          else
            echo "has_gradlew=false" >> $GITHUB_OUTPUT
            echo "Gradle wrapper not yet scaffolded. This step will activate once VS-01 is committed."
          fi

      # ----------------------------------------------------------------------
      # Staging Branch / PR: Debug Build with default debug key
      # ----------------------------------------------------------------------
      - name: Run Tests (Staging & PR)
        if: steps.check_gradle.outputs.has_gradlew == 'true' && github.ref != 'refs/heads/main'
        run: ./gradlew test --stacktrace

      - name: Build Debug APK (Staging & PR)
        if: steps.check_gradle.outputs.has_gradlew == 'true' && github.ref != 'refs/heads/main'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        if: steps.check_gradle.outputs.has_gradlew == 'true' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: awareness-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      # ----------------------------------------------------------------------
      # Main Branch: Production Release Build
      # ----------------------------------------------------------------------
      - name: Decode Release Keystore (Main Branch)
        if: steps.check_gradle.outputs.has_gradlew == 'true' && github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build Signed Release APK (Main Branch)
        if: steps.check_gradle.outputs.has_gradlew == 'true' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "$KEYSTORE_FILE" ]; then
            echo "Building signed Release APK with release keystore..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "No release keystore secret configured; building standard APK..."
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload Release APK
        if: steps.check_gradle.outputs.has_gradlew == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: awareness-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
